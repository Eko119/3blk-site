<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="3BLK Studios">
  <title>3BLK Studios</title>
  <!--
    Triple-bar mark on Ink. Bars are 3/5/3 units wide on a 24-unit
    measure, inset into a 32-unit square. Solid forms survive 16px,
    which is the only size that really matters here.
  -->
  <rect width="32" height="32" fill="#0B0A09"/>
  <g fill="#C98D82">
    <rect x="4" y="5" width="3" height="22"/>
    <rect x="12" y="5" width="5" height="22"/>
    <rect x="25" y="5" width="3" height="22"/>
  </g>
</svg>
